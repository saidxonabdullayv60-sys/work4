<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning Ralli · Toyota Mark IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --neon:#b04cff; --cyan:#2de2ff; --pink:#ff3d8b; --gold:#ffd23f;
    --ink:#05060f; --panel:#0c1024; --text:#eaf0ff;
    --font:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;}
  body{
    font-family:var(--font); color:var(--text); background:#02030c;
    overflow-x:hidden; line-height:1.6;
  }

  /* ===== TO'LIQ SAHNA (qatlamli fon) ===== */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:linear-gradient(#02030c 0%,#080c2a 45%,#221044 75%,#4a1d5c 100%);}
  .stars,.stars::before{position:absolute;inset:0;content:"";
    background-image:
      radial-gradient(2px 2px at 10% 20%,#fff 50%,transparent 51%),
      radial-gradient(2px 2px at 30% 8%,#cfe 50%,transparent 51%),
      radial-gradient(3px 3px at 55% 18%,#fff 50%,transparent 51%),
      radial-gradient(2px 2px at 72% 6%,#fff 50%,transparent 51%),
      radial-gradient(2px 2px at 88% 24%,#fdf 50%,transparent 51%),
      radial-gradient(2px 2px at 20% 38%,#fff 50%,transparent 51%),
      radial-gradient(3px 3px at 64% 40%,#cff 50%,transparent 51%),
      radial-gradient(2px 2px at 92% 48%,#fff 50%,transparent 51%),
      radial-gradient(2px 2px at 42% 30%,#fff 50%,transparent 51%);
    animation:twinkle 4s ease-in-out infinite;}
  .stars::before{background-position:37px 53px;background-size:80% 90%;animation-duration:6s;animation-delay:-2s;opacity:.7}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .moon{position:absolute;top:8%;right:12%;width:clamp(50px,8vw,120px);aspect-ratio:1;border-radius:50%;
    background:#f4f1d8;box-shadow:inset -14px -6px 0 #d9d5ae,0 0 60px 18px rgba(244,241,216,.25);
    animation:float 9s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .cloud{position:absolute;height:14px;background:rgba(120,110,190,.25);box-shadow:20px -10px 0 rgba(120,110,190,.25),-18px -6px 0 rgba(120,110,190,.2);
    animation:drift linear infinite;}
  .cloud.c1{top:18%;width:90px;left:-150px;animation-duration:60s}
  .cloud.c2{top:30%;width:130px;left:-200px;animation-duration:90s;animation-delay:-30s}
  .cloud.c3{top:12%;width:70px;left:-120px;animation-duration:75s;animation-delay:-55s}
  @keyframes drift{to{transform:translateX(calc(100vw + 400px))}}
  .mount{position:absolute;left:0;right:0;bottom:12%;}
  .mount.m1{height:34%;background:#150f33;
    clip-path:polygon(0 100%,0 55%,10% 30%,20% 58%,32% 20%,46% 60%,58% 28%,72% 64%,84% 34%,100% 58%,100% 100%);}
  .mount.m2{height:24%;background:#0c0a22;
    clip-path:polygon(0 100%,0 60%,14% 38%,26% 66%,40% 36%,55% 70%,68% 42%,82% 72%,100% 44%,100% 100%);}
  .city{position:absolute;left:0;right:0;bottom:12%;height:12%;
    background:
      repeating-linear-gradient(90deg,#070718 0 28px,transparent 28px 40px),
      repeating-linear-gradient(90deg,#0a0a22 0 18px,transparent 18px 55px);
    clip-path:polygon(0 100%,0 40%,6% 40%,6% 15%,12% 15%,12% 50%,20% 50%,20% 25%,27% 25%,27% 60%,36% 60%,36% 10%,43% 10%,43% 45%,52% 45%,52% 30%,60% 30%,60% 55%,70% 55%,70% 20%,78% 20%,78% 48%,88% 48%,88% 28%,100% 28%,100% 100%);
    opacity:.9}
  .ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:#0b0c14;
    border-top:3px solid var(--pink);box-shadow:0 -6px 30px rgba(255,61,139,.55);}
  .ground::after{content:"";position:absolute;left:0;right:0;top:48%;height:6px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 40px,transparent 40px 90px);
    animation:road 1.2s linear infinite;}
  @keyframes road{to{background-position:90px 0}}
  .fog{position:absolute;left:0;right:0;bottom:10%;height:14%;
    background:linear-gradient(transparent,rgba(120,70,190,.22));}

  /* ===== ILOVA ===== */
  .app{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    gap:12px;padding:14px 10px 28px;
    --w:clamp(260px,calc((100svh - 330px) * .6667),min(92vw,1000px));}
  header{text-align:center;width:min(94vw,var(--w));}
  h1{font-size:clamp(14px,2.2vw + 6px,34px);color:var(--cyan);text-shadow:3px 3px 0 var(--neon),0 0 18px rgba(45,226,255,.6);letter-spacing:1px}
  .sub{margin-top:8px;font-size:clamp(7px,.7vw + 5px,12px);color:#b9b3e6}

  .hud{width:var(--w);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .hud div{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px #2a2f63;padding:6px 4px;text-align:center}
  .hud small{display:block;font-size:clamp(5px,.5vw + 4px,9px);color:#8e96d6}
  .hud b{display:block;margin-top:4px;font-size:clamp(8px,.8vw + 5px,15px);font-weight:400;color:var(--gold)}
  .hud .pen b{color:var(--pink)}
  @media (max-width:420px){.hud{grid-template-columns:repeat(2,1fr)}}

  .bar{width:var(--w);height:10px;background:#000;border:2px solid #2a2f63}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--neon));transition:width .1s linear}

  .frame{position:relative;width:var(--w);aspect-ratio:2/3;background:#000;
    border:5px solid #000;box-shadow:0 0 0 4px #2a2f63,0 0 40px rgba(176,76,255,.45),0 12px 0 rgba(0,0,0,.5);}
  canvas{display:block;width:100%;height:100%}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;text-align:center;background:rgba(3,4,16,.84);backdrop-filter:blur(3px)}
  .overlay[hidden]{display:none}
  .overlay h2{font-size:clamp(11px,1.4vw + 6px,26px);color:var(--cyan);text-shadow:2px 2px 0 var(--neon)}
  .overlay h2.bad{color:var(--pink);text-shadow:2px 2px 0 #5a0f2e}
  .overlay h2.good{color:var(--gold);text-shadow:2px 2px 0 #7a4c00}
  .overlay p{font-size:clamp(7px,.6vw + 5px,12px);line-height:1.9;color:#cfd6ff;max-width:32em;white-space:pre-line}
  .load{width:70%;height:14px;border:3px solid #fff;background:#000}
  .load i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

  .btn{font-family:var(--font);font-size:clamp(8px,.7vw + 5px,13px);color:#fff;background:var(--neon);
    border:4px solid #000;padding:12px 16px;cursor:pointer;box-shadow:0 6px 0 #5a1d99,inset 0 4px 0 rgba(255,255,255,.3);
    transition:transform .06s,box-shadow .06s,filter .15s;touch-action:manipulation}
  .btn.alt{background:#2a2f63;box-shadow:0 6px 0 #14183a,inset 0 4px 0 rgba(255,255,255,.2)}
  .btn:hover{filter:brightness(1.2)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5a1d99}
  .btn.alt:active{box-shadow:0 1px 0 #14183a}
  .btn:focus-visible,.pad:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

  .touch{width:var(--w);display:flex;justify-content:space-between;gap:10px}
  .touch .grp{display:flex;gap:10px}
  .pad{font-family:var(--font);font-size:20px;width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);color:#fff;background:#1a1f4d;
    border:4px solid #000;box-shadow:0 6px 0 #0a0d28,inset 0 4px 0 rgba(255,255,255,.2);cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:none}
  .pad:active,.pad.on{transform:translateY(5px);box-shadow:0 1px 0 #0a0d28;background:var(--neon)}
  .pad.gas{background:#17613a}.pad.brk{background:#7a1b3a}
  .help{width:var(--w);text-align:center;font-size:clamp(6px,.5vw + 4px,11px);color:#9aa3e6;line-height:2}
  .note{width:var(--w);text-align:center;font-size:clamp(6px,.5vw + 4px,10px);color:var(--pink)}
  .note[hidden]{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (min-width:1800px){.btn{padding:18px 26px}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="stars"></div><div class="moon"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="mount m1"></div><div class="mount m2"></div><div class="city"></div>
  <div class="fog"></div><div class="ground"></div>
</div>

<main class="app">
  <header>
    <h1>TUNING RALLI</h1>
    <p class="sub">Toyota Mark IV · qora · tungi poyga</p>
  </header>

  <section class="hud" aria-label="Poyga ko'rsatkichlari">
    <div><small>VAQT</small><b id="hTime">0.00</b></div>
    <div><small>TEZLIK</small><b id="hSpeed">0</b></div>
    <div class="pen"><small>JARIMA</small><b id="hPen">0</b></div>
    <div><small>REKORD</small><b id="hBest">--</b></div>
  </section>
  <div class="bar" role="progressbar" aria-label="Yo'l bosib o'tilishi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog"></i></div>

  <div class="frame">
    <canvas id="game" width="480" height="720" aria-label="Rally o'yin maydoni"></canvas>
    <div class="overlay" id="ov" role="dialog" aria-live="polite">
      <h2 id="ovTitle">Yuklanmoqda...</h2>
      <p id="ovText">Mashina tayyorlanmoqda</p>
      <div class="load" id="ovLoad"><i id="ovLoadBar"></i></div>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>

  <p class="note" id="note" hidden>Diqqat: rekord brauzerda saqlanmadi.</p>

  <div class="touch" aria-label="Sensorli boshqaruv">
    <div class="grp">
      <button class="pad" data-k="left" aria-label="Chapga">◀</button>
      <button class="pad" data-k="right" aria-label="O'ngga">▶</button>
    </div>
    <div class="grp">
      <button class="pad brk" data-k="down" aria-label="Tormoz">■</button>
      <button class="pad gas" data-k="up" aria-label="Gaz">▲</button>
    </div>
  </div>
  <p class="help">← → yoki A D: burilish · ↑ yoki W: gaz · ↓ yoki S: tormoz · P: pauza</p>
  <div class="sr" id="live" aria-live="assertive"></div>
  <noscript><p class="note">O'yin uchun JavaScript yoqilgan bo'lishi kerak.</p></noscript>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const W=480,H=720,CAR_Y=560,TRACK=14000,HALF=100,LIMIT=80,ROW=4;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('game'); let ctx=null;
try{ctx=cv.getContext('2d');}catch(e){}
const dark=document.createElement('canvas'); dark.width=W; dark.height=H;
const dctx=dark.getContext?dark.getContext('2d'):null;

const ov=$('ov'),ovTitle=$('ovTitle'),ovText=$('ovText'),ovLoad=$('ovLoad'),ovLoadBar=$('ovLoadBar'),ovBtns=$('ovBtns');
const hTime=$('hTime'),hSpeed=$('hSpeed'),hPen=$('hPen'),hBest=$('hBest'),prog=$('prog'),live=$('live'),note=$('note');

/* ---------- yordamchi ---------- */
function hash(n){n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return (n>>>0)/4294967296;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const fmt=t=>t.toFixed(2);
function center(y){const r=Math.min(1,Math.max(0,y/700));return r*(130*Math.sin(y/1000)+70*Math.sin(y/430+1.3));}

/* ---------- rekord ---------- */
let best=null;
function loadBest(){
  try{const v=localStorage.getItem('rally-best');best=v?parseFloat(v):null;}
  catch(e){note.hidden=false;}
  hBest.textContent=best?fmt(best):'--';
}
function saveBest(t){
  best=t; hBest.textContent=fmt(t);
  try{localStorage.setItem('rally-best',String(t));}catch(e){note.hidden=false;}
}

/* ---------- to'siqlar ---------- */
const obstacles=[];
(function(){
  const r=rng(7);
  for(let y=900;y<TRACK-500;y+=260+r()*200){
    obstacles.push({y:y,off:(r()*2-1)*(HALF-30),type:r()<.5?'cone':'rock',hit:false});
  }
})();

/* ---------- holat ---------- */
const car={x:0,y:0,a:0,v:0};
let camX=0,time=0,penalty=0,flash=0,shake=0,countT=0,lastCount=-9,state='loading';
const parts=[];
const keys={left:0,right:0,up:0,down:0}, touch={left:0,right:0,up:0,down:0};

function resetRun(){
  car.x=0;car.y=0;car.a=0;car.v=0;camX=0;time=0;penalty=0;flash=0;shake=0;parts.length=0;
  obstacles.forEach(o=>o.hit=false);
}

/* ---------- oyna (overlay) ---------- */
function showOverlay(cfg){
  ov.hidden=false;
  ovTitle.textContent=cfg.title; ovTitle.className=cfg.cls||'';
  ovText.textContent=cfg.text||'';
  ovLoad.hidden=!cfg.loading;
  ovBtns.innerHTML='';
  (cfg.buttons||[]).forEach((b,i)=>{
    const el=document.createElement('button');
    el.className='btn'+(b.alt?' alt':''); el.textContent=b.label; el.type='button';
    el.addEventListener('click',b.fn); ovBtns.appendChild(el);
    if(i===0) setTimeout(()=>el.focus({preventScroll:true}),30);
  });
}
const hideOverlay=()=>{ov.hidden=true;};

function showReady(){
  state='ready';
  showOverlay({title:'TUNING RALLI',
    text:"Yo'lda qoling, to'siqlarga urilmang va marraga eng tez yetib keling.\nVaqt chegarasi: "+LIMIT+" soniya.\nYo'ldan chiqsangiz sekinlashasiz, to'siq +2 soniya jarima.",
    buttons:[{label:'BOSHLASH',fn:startRun}]});
}
function startRun(){resetRun();state='count';countT=3;hideOverlay();cv.focus&&0;}
function pauseGame(){
  if(state!=='run')return;
  state='pause';
  showOverlay({title:'PAUZA',text:'Davom etamizmi?',buttons:[
    {label:'DAVOM ETISH',fn:()=>{state='run';hideOverlay();}},
    {label:'QAYTA BOSHLASH',alt:1,fn:startRun}]});
}
function showError(msg){
  state='error';
  showOverlay({title:'XATO',cls:'bad',text:msg,buttons:[{label:'QAYTA URINISH',fn:()=>location.reload()}]});
}
function finishWin(){
  state='win';
  const t=time+penalty; const rec=(best===null||t<best);
  if(rec) saveBest(t);
  live.textContent="Marraga yetdingiz!";
  showOverlay({title:'MARRA!',cls:'good',
    text:'Natija: '+fmt(t)+' s\n(Haydash '+fmt(time)+' + jarima '+fmt(penalty)+')\n'+(rec?'YANGI REKORD!':'Rekord: '+fmt(best)+' s'),
    buttons:[{label:'YANA POYGA',fn:startRun}]});
}
function finishLose(){
  state='lose';
  live.textContent="Vaqt tugadi";
  showOverlay({title:'VAQT TUGADI',cls:'bad',
    text:"Marraga yetib borolmadingiz.\nBosib o'tilgan yo'l: "+Math.floor(car.y/TRACK*100)+'%',
    buttons:[{label:'QAYTA URINISH',fn:startRun}]});
}

/* ---------- kiritish ---------- */
const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){pauseGame();return;}
  const k=map[e.key];
  if(k&&(state==='run'||state==='count')){keys[k]=1;e.preventDefault();}
});
addEventListener('keyup',e=>{const k=map[e.key];if(k)keys[k]=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
document.querySelectorAll('.pad').forEach(p=>{
  const k=p.dataset.k;
  const on=e=>{e.preventDefault();touch[k]=1;p.classList.add('on');try{p.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{touch[k]=0;p.classList.remove('on');};
  p.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>p.addEventListener(ev,off));
  p.addEventListener('contextmenu',e=>e.preventDefault());
});
const inp=k=>keys[k]||touch[k];

/* ---------- yangilash ---------- */
function update(dt){
  const steer=inp('right')-inp('left');
  const onRoad=Math.abs(car.x-center(car.y))<HALF-8;
  const maxS=onRoad?560:210;
  if(inp('up')) car.v+=320*dt; else car.v-=110*dt;
  if(inp('down')) car.v-=720*dt;
  if(car.v>maxS) car.v-=(onRoad?300:700)*dt;
  car.v=Math.max(0,car.v);
  car.a+=steer*dt*2.3*Math.min(1,car.v/150);
  if(!steer) car.a*=Math.max(0,1-1.6*dt);
  car.a=Math.max(-.8,Math.min(.8,car.a));
  car.x+=Math.sin(car.a)*car.v*dt;
  car.y+=Math.cos(car.a)*car.v*dt;
  time+=dt;

  for(const o of obstacles){
    if(o.hit)continue;
    if(Math.abs(o.y-car.y)<30){
      const ox=center(o.y)+o.off;
      if(Math.abs(ox-car.x)<24){
        o.hit=true;car.v*=.35;penalty+=2;flash=1;shake=reduce?0:1;
        live.textContent="To'siqqa urildingiz, plyus 2 soniya";
      }
    }
  }
  if(!reduce&&!onRoad&&car.v>40&&parts.length<60){
    parts.push({x:W/2+(car.x-camX)+(Math.random()*20-10),y:CAR_Y+26,vx:Math.random()*60-30,life:.6});
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;p.y+=car.v*dt*.8;p.x+=p.vx*dt;
    if(p.life<=0)parts.splice(i,1);
  }
  camX+=(car.x-camX)*Math.min(1,dt*6);
  flash=Math.max(0,flash-dt*2.2);shake=Math.max(0,shake-dt*3);

  if(car.y>=TRACK) finishWin();
  else if(time+penalty>=LIMIT) finishLose();
}

/* ---------- chizish ---------- */
function drawCar(){
  ctx.save();
  ctx.translate(W/2+(car.x-camX),CAR_Y);
  ctx.rotate(car.a);
  ctx.shadowColor='#b04cff';ctx.shadowBlur=26;
  ctx.fillStyle='#7a3cff';ctx.fillRect(-17,-30,34,62);
  ctx.shadowBlur=0;
  ctx.fillStyle='#000';                                  // g'ildiraklar
  ctx.fillRect(-19,-22,6,14);ctx.fillRect(13,-22,6,14);ctx.fillRect(-19,12,6,14);ctx.fillRect(13,12,6,14);
  ctx.fillStyle='#0b0b0f';ctx.fillRect(-14,-32,28,64);   // kuzov
  ctx.fillStyle='#1b1c26';ctx.fillRect(-12,-30,5,60);    // yaltirash
  ctx.fillStyle='#10213a';ctx.fillRect(-10,-14,20,9);    // old oyna
  ctx.fillStyle='#07090f';ctx.fillRect(-10,-4,20,14);    // tom
  ctx.fillStyle='#10213a';ctx.fillRect(-10,10,20,6);     // orqa oyna
  ctx.fillStyle='#000';ctx.fillRect(-16,26,32,5);        // spoyler
  ctx.fillStyle='#fff7c2';ctx.fillRect(-12,-33,7,4);ctx.fillRect(5,-33,7,4);
  ctx.fillStyle='#ff2244';ctx.fillRect(-13,31,8,3);ctx.fillRect(5,31,8,3);
  ctx.restore();
}
function drawObstacle(o){
  const sy=CAR_Y-(o.y-car.y); if(sy<-30||sy>H+30)return;
  const sx=W/2+center(o.y)+o.off-camX+(o.hit?18:0);
  ctx.save();ctx.translate(sx,sy);if(o.hit)ctx.globalAlpha=.5;
  if(o.type==='cone'){
    ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
    ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();
  }else{
    ctx.fillStyle='#4b4f5e';ctx.beginPath();
    ctx.moveTo(-14,4);ctx.lineTo(-8,-12);ctx.lineTo(8,-13);ctx.lineTo(15,2);ctx.lineTo(6,13);ctx.lineTo(-8,12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6b7084';ctx.fillRect(-6,-8,8,5);
  }
  ctx.restore();
}
function drawTree(wy,side,i){
  const h=hash(i*13+side*5+3); if(h>.78)return;
  const off=HALF+36+hash(i*29+side)*150;
  const sx=W/2+center(wy)+side*off-camX, sy=CAR_Y-(wy-car.y);
  if(sy<-50||sy>H+50||sx<-40||sx>W+40)return;
  const s=16+h*16;
  ctx.fillStyle='#1a0f0a';ctx.fillRect(sx-2,sy+s*.5,4,8);
  ctx.fillStyle='#0a2a1c';ctx.beginPath();ctx.moveTo(sx,sy-s*1.3);ctx.lineTo(sx+s,sy+s*.6);ctx.lineTo(sx-s,sy+s*.6);ctx.fill();
  ctx.fillStyle='#0f3b27';ctx.beginPath();ctx.moveTo(sx,sy-s*1.3);ctx.lineTo(sx+s*.5,sy-s*.1);ctx.lineTo(sx-s*.5,sy-s*.1);ctx.fill();
}
function drawNight(){
  dctx.globalCompositeOperation='source-over';
  dctx.clearRect(0,0,W,H);
  dctx.fillStyle='rgba(2,4,16,.66)';dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out';
  dctx.save();dctx.translate(W/2+(car.x-camX),CAR_Y);dctx.rotate(car.a);
  const g=dctx.createLinearGradient(0,-30,0,-380);
  g.addColorStop(0,'rgba(0,0,0,.98)');g.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=g;dctx.beginPath();dctx.moveTo(-10,-30);dctx.lineTo(10,-30);dctx.lineTo(125,-380);dctx.lineTo(-125,-380);dctx.fill();
  const r=dctx.createRadialGradient(0,0,10,0,0,90);
  r.addColorStop(0,'rgba(0,0,0,.7)');r.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=r;dctx.fillRect(-90,-90,180,180);
  dctx.restore();
  ctx.drawImage(dark,0,0);
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*8*shake,(Math.random()-.5)*8*shake);
  for(let sy=0;sy<H;sy+=ROW){
    const wy=car.y+(CAR_Y-sy), cx=W/2+center(wy)-camX;
    const band=Math.floor(wy/90)&1;
    ctx.fillStyle=band?'#0c1d15':'#0a1812';ctx.fillRect(0,sy,W,ROW+1);
    const cb=(Math.floor(wy/50)&1)?'#d9d9e8':'#d6224f';
    ctx.fillStyle=cb;ctx.fillRect(cx-HALF-7,sy,7,ROW+1);ctx.fillRect(cx+HALF,sy,7,ROW+1);
    if(wy>=TRACK&&wy<TRACK+40){
      for(let i=0;i<10;i++){ctx.fillStyle=((i+Math.floor(wy/20))&1)?'#fff':'#111';ctx.fillRect(cx-HALF+i*20,sy,20,ROW+1);}
    }else{
      ctx.fillStyle=(Math.floor(wy/70)&1)?'#25282f':'#22252b';ctx.fillRect(cx-HALF,sy,HALF*2,ROW+1);
      if(wy>-20&&(Math.floor(wy/60)&1)){ctx.fillStyle='#e8d36a';ctx.fillRect(cx-2,sy,4,ROW+1);}
    }
  }
  obstacles.forEach(drawObstacle);
  const top=car.y+CAR_Y, bot=car.y-(H-CAR_Y);
  for(let i=Math.floor((bot-60)/80);i<=Math.ceil((top+60)/80);i++){
    const wy=i*80+hash(i*7+1)*60;
    drawTree(wy,-1,i);drawTree(wy,1,i);
  }
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.6)*.6;ctx.fillStyle='#6b5a3a';ctx.fillRect(p.x,p.y,6,6);});
  ctx.globalAlpha=1;
  drawNight();
  drawCar();
  if(flash>0){ctx.fillStyle='rgba(255,40,80,'+(flash*.45)+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();

  if(state==='count'){
    const txt=countT>0?String(Math.ceil(countT)):"YO'L!";
    if(txt!==lastCount){lastCount=txt;live.textContent=txt;}
    ctx.save();ctx.textAlign='center';ctx.font='56px "Press Start 2P", monospace';
    ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(txt,W/2,300);
    ctx.fillStyle=countT>0?'#ffd23f':'#2de2ff';ctx.fillText(txt,W/2,300);ctx.restore();
  }
}
function hud(){
  hTime.textContent=fmt(time);
  hSpeed.textContent=Math.round(car.v*.4)+' km/s'.replace('km/s','');
  hPen.textContent='+'+Math.round(penalty);
  const p=Math.min(100,car.y/TRACK*100);
  prog.style.width=p+'%';
  prog.parentNode.setAttribute('aria-valuenow',Math.round(p));
}

/* ---------- sikl ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='count'){countT-=dt;if(countT<=-.6){state='run';}}
  else if(state==='run')update(dt);
  render();hud();
  requestAnimationFrame(loop);
}

/* ---------- ishga tushirish ---------- */
function init(){
  if(!ctx||!dctx){showError("Brauzeringiz canvas'ni qo'llab-quvvatlamaydi. Boshqa brauzerda oching.");return;}
  loadBest();
  showOverlay({title:'YUKLANMOQDA...',text:'Mashina va yo\'l tayyorlanmoqda',loading:true});
  let pct=0;const iv=setInterval(()=>{pct=Math.min(90,pct+15);ovLoadBar.style.width=pct+'%';},120);
  const fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(()=>{
    setTimeout(()=>{clearInterval(iv);ovLoadBar.style.width='100%';setTimeout(showReady,200);},700);
  });
  requestAnimationFrame(t=>{last=t;loop(t);});
}
init();
})();
</script>
